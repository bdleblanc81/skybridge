# fly.toml app configuration file generated for skybridge-hdxfrg on 2026-11-12T21:08:52Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'skybridge-hdxfrg'  #you need to rename it
primary_region = 'iad'

[build]
image = "videah/skybridge:latest"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 4
  checks = [{ grace_period = '30s', interval = '30s', method = 'GET', path = '/api/v2/instance', timeout = '5s' }]
  concurrency = { hard_limit = 999999, soft_limit = 9999, type = 'requests' }

[env]
  SKYBRIDGE_BASEURL = 'skybridge-hdxfrg.fly.dev' #you need to rename it using your app name .fly.dev
  SKYBRIDGE_SHOW_INDEX = 'true'
  FLY_SWAP = 'true'
  SKYBRIDGE_SECRET='246810' #you need to fill it, I taped random numbers and it worked
  SKYBRIDGE_REQUIRE_AUTH_PASSWORD = true
  SKYBRIDGE_AUTH_PASSWORD = '246810' #if above is true, it will be asked when you'll try to log in to you bsky account in the app
  SKYBRIDGE_ALLOW_BACKFILL = true

[[mounts]]
  source = 'skybridge_data'
  destination = '/app/database'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
